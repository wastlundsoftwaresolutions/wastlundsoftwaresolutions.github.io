# Required pages exist and local links resolve. main is the live site.
# Push, not pull_request: Cursor's Review and Fix Verify triggers only hear
# workflow runs that GitHub started from a push.
name: Verify

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/verify_site.py
